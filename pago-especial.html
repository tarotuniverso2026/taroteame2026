<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taroteame — Pago especial</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f2f8;
  color:#241b2f;
  margin:0;
  padding:20px;
}
.wrap{
  max-width:560px;
  margin:40px auto;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:25px;
  box-shadow:0 3px 14px #0001;
  text-align:center;
}
h1{
  color:#60377b;
}
.ok{
  color:#246b35;
}
.error{
  color:#b00020;
}
.info{
  background:#f3e8f7;
  border-radius:12px;
  padding:15px;
  margin-top:18px;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>🔮 Taroteame</h1>

    <div id="resultado">
      <p>⏳ Confirmando tu pago...</p>
    </div>

  </div>
</div>

<script>

const cfg=window.TAROTEAME_CONFIG||{};

const supabaseClient=
window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_PUBLISHABLE_KEY
);

async function confirmarPago(){

  const resultado=document.getElementById("resultado");

  try{

    const params=new URLSearchParams(
      window.location.search
    );

    const orderID=
      params.get("token") ||
      params.get("orderID") ||
      params.get("orderId");

    if(!orderID){
      throw new Error(
        "No se encontró el pedido de PayPal."
      );
    }

    const {data,error}=
      await supabaseClient.functions.invoke(
        "capture-special-payment",
        {
          body:{
            orderID:orderID
          }
        }
      );

    if(error){
      throw new Error(
        error.message ||
        "No se pudo confirmar el pago."
      );
    }

    if(!data || data.ok!==true){
      throw new Error(
        data?.error ||
        "No se pudo confirmar el pago."
      );
    }

    resultado.className="ok";

    resultado.innerHTML=`
      <h2>✅ Pago confirmado</h2>

      <div class="info">
        <p><strong>Concepto:</strong></p>
        <p>${esc(data.concept || "Pago especial")}</p>

        <p><strong>Importe:</strong></p>
        <p>${esc(data.amount || "")} €</p>
      </div>

      <p>Gracias por confiar en Taroteame.</p>
    `;

  }catch(e){

    resultado.className="error";

    resultado.innerHTML=`
      <h2>❌ No se pudo confirmar el pago</h2>
      <p>${esc(e.message)}</p>
    `;

  }

}

function esc(v){

  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

confirmarPago();

</script>

</body>
</html>
