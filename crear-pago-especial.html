<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taroteame — Crear pago especial</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f2f8;
  color:#241b2f;
  margin:0;
  padding:20px;
}
.wrap{
  max-width:560px;
  margin:auto;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 3px 14px #0001;
}
h1{
  color:#60377b;
}
label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#60377b;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
}
.error{
  color:#b00020;
  margin-top:15px;
}
.ok{
  color:#246b35;
  margin-top:15px;
}
.result{
  background:#f3e8f7;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
  word-break:break-word;
}
.result a{
  color:#60377b;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>💳 Crear pago especial</h1>

<p>Introduce el importe y concepto que quieras cobrar.</p>

<label for="name">Nombre del cliente</label>
<input id="name" type="text" placeholder="Nombre y apellidos">

<label for="email">Email del cliente</label>
<input id="email" type="email" placeholder="cliente@email.com">

<label for="amount">Importe (€)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="12.00">

<label for="concept">Concepto</label>
<textarea id="concept" rows="3" placeholder="Lectura especial"></textarea>

<button id="btn" type="button" onclick="crearPago()">
🟣 Crear enlace de pago
</button>

<div id="msg"></div>

</div>
</div>

<script>

const cfg = window.TAROTEAME_CONFIG || {};

const supabaseClient = window.supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_PUBLISHABLE_KEY
);

async function crearPago(){

  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  msg.className = "";
  msg.textContent = "Creando enlace...";

  btn.disabled = true;

  try{

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if(sessionError){
      throw new Error(sessionError.message);
    }

    if(!sessionData || !sessionData.session){
      throw new Error(
        "Tu sesión ha caducado. Vuelve a iniciar sesión."
      );
    }

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const amount =
      Number(document.getElementById("amount").value);

    const concept =
      document.getElementById("concept").value.trim();

    if(!name){
      throw new Error("Introduce el nombre del cliente.");
    }

    if(!email){
      throw new Error("Introduce el email del cliente.");
    }

    if(!amount || amount <= 0){
      throw new Error("Introduce un importe válido.");
    }

    if(!concept){
      throw new Error("Introduce el concepto del pago.");
    }

    const body = {
      name: name,
      email: email,
      amount: amount,
      concept: concept
    };

    const { data, error } =
      await supabaseClient.functions.invoke(
        "create-special-payment",
        {
          body: body
        }
      );

    if(error){
      throw new Error(
        error.message || "No se pudo crear el pago."
      );
    }

    if(!data || data.ok !== true){
      throw new Error(
        data?.error || "No se pudo crear el pago."
      );
    }

    if(!data.payment_url){
      throw new Error(
        "PayPal no devolvió el enlace de pago."
      );
    }

    window._paymentUrl = data.payment_url;

    msg.className = "ok";

    msg.innerHTML = `
      <div class="result">
        <strong>✅ Enlace de pago creado</strong>

        <br><br>

        <a
          href="${esc(data.payment_url)}"
          target="_blank"
          rel="noopener"
        >
          🔗 Abrir pago de PayPal
        </a>

        <br><br>

        <button
          type="button"
          onclick="copiar()"
        >
          📋 Copiar enlace
        </button>
      </div>
    `;

  }catch(error){

    console.error(error);

    msg.className = "error";

    msg.textContent =
      "❌ " +
      (error.message || "Ha ocurrido un error.");

  }finally{

    btn.disabled = false;

  }

}

function copiar(){

  if(!window._paymentUrl){
    alert("No hay ningún enlace para copiar.");
    return;
  }

  navigator.clipboard
    .writeText(window._paymentUrl)
    .then(function(){
      alert("✅ Enlace copiado.");
    })
    .catch(function(){
      alert("No se pudo copiar automáticamente.");
    });

}

function esc(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
