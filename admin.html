<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taroteame — Panel</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<header class="nav">
  <a class="brand" href="index.html">TAROTEAME</a>
  <span style="margin-left:auto;color:#cfc3d5">Panel de reservas</span>
</header>

<main class="section">
  <div class="section-head">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h2>Mis reservas</h2>
    <p id="status">Inicia sesión para continuar.</p>
  </div>

  <div id="login" class="booking-card" style="max-width:520px;margin:auto;padding:28px">
    <label>Email</label>
    <input id="email" type="email">

    <label>Contraseña</label>
    <input id="password" type="password">

    <button id="loginBtn" class="nav-cta" style="margin-top:18px;border:0;cursor:pointer">
      Entrar
    </button>

    <p id="loginMsg" class="payment-message"></p>
  </div>

  <div id="panel" style="display:none;max-width:1100px;margin:auto">

    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap">
      <input id="filter" type="date">

      <button id="refresh" class="nav-cta" style="border:0;cursor:pointer">
        Actualizar
      </button>

      <button id="addCustomer" class="nav-cta" style="border:0;cursor:pointer">
        ➕ Añadir cliente
      </button>

      <button id="logout" class="secondary-btn" style="width:auto;margin:0;padding:10px 18px">
        Salir
      </button>
    </div>

    <div id="customerForm" class="booking-card" style="display:none;padding:22px;margin-bottom:20px">
      <h3>Añadir cliente a la cartera</h3>

      <label>Nombre</label>
      <input id="customerName" type="text" placeholder="Nombre del cliente">

      <label>Teléfono</label>
      <input id="customerPhone" type="text" placeholder="Teléfono">

      <label>Email</label>
      <input id="customerEmail" type="email" placeholder="Email">

      <label>Notas</label>
      <textarea id="customerNotes" placeholder="Notas del cliente"></textarea>

      <div style="display:flex;gap:10px;margin-top:15px">
        <button id="saveCustomer" class="nav-cta" style="border:0;cursor:pointer">
          Guardar cliente
        </button>

        <button id="cancelCustomer" class="secondary-btn" style="width:auto;margin:0">
          Cancelar
        </button>
      </div>

      <p id="customerMsg" class="payment-message"></p>
    </div>

    <div id="table" class="booking-card" style="padding:0;overflow:auto"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
