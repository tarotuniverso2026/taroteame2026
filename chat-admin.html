<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Taroteame — Chat</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">TAROTEAME</a>
  <span style="margin-left:auto;">Chat privado</span>
</header>

<main class="section">

  <div class="section-head">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h2>Chat con clientes</h2>
    <p>Gestiona las conversaciones desde aquí.</p>
  </div>

  <div id="login" class="booking-card" style="max-width:520px;margin:auto;padding:28px">

    <label>Email</label>
    <input id="email" type="email" autocomplete="email">

    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginBtn" class="nav-cta"
            style="margin-top:18px;border:0;cursor:pointer;">
      Entrar
    </button>

    <p id="loginMsg" class="payment-message"></p>

  </div>

  <div id="panel" style="display:none;max-width:900px;margin:auto;">

    <div class="booking-card" style="padding:20px;">

      <h3>💬 Conversaciones</h3>

      <button id="notificationsBtn"
              class="nav-cta"
              style="border:0;cursor:pointer;margin-top:15px;">
        🔔 Activar avisos
      </button>

      <p id="notificationMsg"></p>

      <p id="status">Cargando...</p>

      <div id="chat-list"></div>

    </div>

  </div>

</main>

<script>

const cfg = window.TAROTEAME_CONFIG || {};

const sb = supabase.createClient(
  cfg.SUPABASE_URL,
  cfg.SUPABASE_PUBLISHABLE_KEY
);

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const loginMsg = document.getElementById("loginMsg");

document.getElementById("loginBtn").onclick = async () => {

  loginMsg.textContent = "Entrando...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    loginMsg.textContent = "Error: " + error.message;
    return;
  }

  login.style.display = "none";
  panel.style.display = "block";

  document.getElementById("status").textContent =
    "Sesión iniciada correctamente.";
};

document.getElementById("notificationsBtn").onclick = async () => {

  if (!("Notification" in window)) {
    document.getElementById("notificationMsg").textContent =
      "Este navegador no admite notificaciones.";
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission === "granted") {
    document.getElementById("notificationMsg").textContent =
      "✅ Avisos activados correctamente.";
  } else {
    document.getElementById("notificationMsg").textContent =
      "Los avisos no están activados.";
  }
};

</script>

</body>
</html>
