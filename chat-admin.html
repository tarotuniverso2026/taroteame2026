<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Taroteame — Chat privado</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">TAROTEAME</a>
  <span style="margin-left:auto;">Chat privado</span>
</header>

<main class="section">

  <div class="section-head">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h2>Chat con clientes</h2>
    <p>Gestiona las conversaciones desde aquí.</p>
  </div>

  <!-- LOGIN -->

  <div id="login"
       class="booking-card"
       style="max-width:520px;margin:auto;padding:28px;">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Tu email"
    >

    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Tu contraseña"
    >

    <button
      id="loginBtn"
      class="nav-cta"
      type="button"
      style="margin-top:18px;border:0;cursor:pointer;"
    >
      Entrar
    </button>

    <p
      id="loginMsg"
      class="payment-message"
    ></p>

  </div>


  <!-- PANEL -->

  <div
    id="panel"
    style="display:none;max-width:900px;margin:auto;"
  >

    <div
      class="booking-card"
      style="padding:20px;"
    >

      <h3>💬 Conversaciones</h3>

      <p id="status">
        ✅ Sesión iniciada correctamente.
      </p>


      <!-- NOTIFICACIONES -->

      <button
        id="notificationsBtn"
        class="nav-cta"
        type="button"
        style="border:0;cursor:pointer;margin-top:15px;"
      >
        🔔 Activar avisos
      </button>

      <p id="notificationMsg"></p>


      <!-- CHAT -->

      <div id="chat-list"></div>

    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://ozbbgfxixbgffxnhqpzh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd";


const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const loginMsg =
  document.getElementById("loginMsg");

const loginBtn =
  document.getElementById("loginBtn");


loginBtn.addEventListener("click", async () => {

  loginMsg.textContent = "Entrando...";

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if (!email || !password) {

    loginMsg.textContent =
      "Escribe tu email y contraseña.";

    return;
  }


  try {

    const { error } =
      await sb.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      loginMsg.textContent =
        "Error: " + error.message;

      return;
    }


    login.style.display = "none";

    panel.style.display = "block";


    document.getElementById("status")
      .textContent =
      "✅ Sesión iniciada correctamente.";

  } catch (error) {

    console.error(error);

    loginMsg.textContent =
      "❌ Error al iniciar sesión.";

  }

});



/* NOTIFICACIONES */

document
  .getElementById("notificationsBtn")
  .addEventListener("click", async () => {

    const msg = document.getElementById("notificationMsg");

    if (!("Notification" in window) || !("serviceWorker" in navigator)) {
      msg.textContent = "❌ Este navegador no admite avisos.";
      return;
    }

    try {
      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        msg.textContent = "❌ Los avisos no están activados.";
        return;
      }

      const registration = await navigator.serviceWorker.register(
        "/service-worker.js"
      );

      const vapidPublicKey =
        "BALCKNjHMWSNEaNlvAXjnfzZPG3BXgMDEw9cQbFsGWw6OxYoLmDYtKWCBOPVN8vAg3VTu6gX8XZcFSC-x1nc12Y";

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const rawData = atob(base64);

        return Uint8Array.from(
          [...rawData].map(char => char.charCodeAt(0))
        );
      }

      const subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey:
            urlBase64ToUint8Array(vapidPublicKey)
        });

      const { error } = await sb
        .from("push_subscriptions")
        .upsert(
          {
            endpoint: subscription.endpoint,
            subscription: subscription.toJSON()
          },
          {
            onConflict: "endpoint"
          }
        );

      if (error) {
        console.error(error);
        msg.textContent =
          "❌ No se pudo guardar el aviso.";
        return;
      }

      msg.textContent =
        "✅ Avisos activados y guardados correctamente.";

    } catch (error) {
      console.error(error);
      msg.textContent =
        "❌ Error al activar los avisos.";
    }
  });

</script>
<script>
async function cargarConversaciones() {
  const lista = document.getElementById("chat-list");

  const { data, error } = await sb
    .from("chat_messages")
    .select("visitor_id, sender, message, created_at")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    lista.innerHTML = "<p>❌ No se pudieron cargar las conversaciones.</p>";
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = "<p>No hay mensajes todavía.</p>";
    return;
  }

  const grupos = {};

  data.forEach(msg => {
    if (!grupos[msg.visitor_id]) {
      grupos[msg.visitor_id] = [];
    }
    grupos[msg.visitor_id].push(msg);
  });

  lista.innerHTML = "";

  Object.entries(grupos).forEach(([visitorId, mensajes]) => {
    const bloque = document.createElement("div");

    bloque.style.cssText =
      "margin-top:20px;padding:15px;border:1px solid #ddd;border-radius:12px;";

    const titulo = document.createElement("h4");
    titulo.textContent = "💬 Cliente";
    bloque.appendChild(titulo);

    mensajes.forEach(msg => {
      const linea = document.createElement("p");

      linea.style.cssText =
        "padding:10px;margin:6px 0;border-radius:10px;background:" +
        (msg.sender === "visitor" ? "#f3eadf" : "#7650a5") +
        ";color:" +
        (msg.sender === "visitor" ? "#544557" : "#fff");

      linea.textContent =
        (msg.sender === "visitor" ? "Cliente: " : "Tú: ") +
        msg.message;

      bloque.appendChild(linea);
    });

    lista.appendChild(bloque);
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    setTimeout(cargarConversaciones, 300);
  }
});
</script>
  <script>
async function responderCliente(visitorId) {
  const mensaje = prompt("Escribe tu respuesta:");

  if (!mensaje || !mensaje.trim()) return;

  const { error } = await sb
    .from("chat_messages")
    .insert({
      visitor_id: visitorId,
      sender: "admin",
      message: mensaje.trim()
    });

  if (error) {
    alert("❌ No se pudo enviar la respuesta.");
    console.error(error);
    return;
  }

  alert("✅ Respuesta enviada.");
  cargarConversaciones();
}
  </script>
</body>
</html>
