<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Taroteame — Chat privado</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">TAROTEAME</a>
  <span style="margin-left:auto;">Chat privado</span>
</header>

<main class="section">

  <div class="section-head">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h2>Chat con clientes</h2>
    <p>Gestiona las conversaciones desde aquí.</p>
  </div>

  <!-- LOGIN -->

  <div id="login"
       class="booking-card"
       style="max-width:520px;margin:auto;padding:28px;">

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Tu email"
    >

    <label for="password">Contraseña</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Tu contraseña"
    >

    <button
      id="loginBtn"
      class="nav-cta"
      type="button"
      style="margin-top:18px;border:0;cursor:pointer;"
    >
      Entrar
    </button>

    <p
      id="loginMsg"
      class="payment-message"
    ></p>

  </div>

cli
  <!-- PANEL -->

  <div
    id="panel"
    style="display:none;max-width:900px;margin:auto;"
  >

    <div
      class="booking-card"
      style="padding:20px;"
    >

      <h3>💬 Conversaciones</h3>

      <p id="status">
        ✅ Sesión iniciada correctamente.
      </p>


      <!-- NOTIFICACIONES -->

      <button
        id="notificationsBtn"
        class="nav-cta"
        type="button"
        style="border:0;cursor:pointer;margin-top:15px;"
      >
        🔔 Activar avisos
      </button>

      <p id="notificationMsg"></p>


      <!-- CHAT -->

      <div id="chat-list"></div>

    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://ozbbgfxixbgffxnhqpzh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Xag7GClzJc37vg2DQXhBVA_QfU0NUyd";


const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const login =
  document.getElementById("login");

const panel =
  document.getElementById("panel");

const loginMsg =
  document.getElementById("loginMsg");

const loginBtn =
  document.getElementById("loginBtn");


loginBtn.addEventListener("click", async () => {

  loginMsg.textContent = "Entrando...";

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;


  if (!email || !password) {

    loginMsg.textContent =
      "Escribe tu email y contraseña.";

    return;
  }


  try {

    const { error } =
      await sb.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      loginMsg.textContent =
        "Error: " + error.message;

      return;
    }


    login.style.display = "none";

    panel.style.display = "block";


    document.getElementById("status")
      .textContent =
      "✅ Sesión iniciada correctamente.";

  } catch (error) {

    console.error(error);

    loginMsg.textContent =
      "❌ Error al iniciar sesión.";

  }

});



/* NOTIFICACIONES */

document
  .getElementById("notificationsBtn")
  .addEventListener("click", async () => {

    const msg = document.getElementById("notificationMsg");

    if (!("Notification" in window) || !("serviceWorker" in navigator)) {
      msg.textContent = "❌ Este navegador no admite avisos.";
      return;
    }

    try {
      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        msg.textContent = "❌ Los avisos no están activados.";
        return;
      }

      const registration = await navigator.serviceWorker.register(
        "/service-worker.js"
      );

      const vapidPublicKey =
        "BALCKNjHMWSNEaNlvAXjnfzZPG3BXgMDEw9cQbFsGWw6OxYoLmDYtKWCBOPVN8vAg3VTu6gX8XZcFSC-x1nc12Y";

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const rawData = atob(base64);

        return Uint8Array.from(
          [...rawData].map(char => char.charCodeAt(0))
        );
      }

      const subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey:
            urlBase64ToUint8Array(vapidPublicKey)
        });

      const { error } = await sb
        .from("push_subscriptions")
        .upsert(
          {
            endpoint: subscription.endpoint,
            subscription: subscription.toJSON()
          },
          {
            onConflict: "endpoint"
          }
        );

      if (error) {
        console.error(error);
        msg.textContent =
          "❌ No se pudo guardar el aviso.";
        return;
      }

      msg.textContent =
        "✅ Avisos activados y guardados correctamente.";

    } catch (error) {
      console.error(error);
      msg.textContent =
        "❌ Error al activar los avisos.";
    }
  });

</script>
<script>
async function cargarConversaciones() {
  const lista = document.getElementById("chat-list");

  const { data, error } = await sb
    .from("chat_messages")
.select("visitor_id, customer_name, sender, message, created_at")
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    lista.innerHTML = "<p>❌ No se pudieron cargar las conversaciones.</p>";
    return;
  }

  if (!data || data.length === 0) {
    lista.innerHTML = "<p>No hay mensajes todavía.</p>";
    return;
  }

  const grupos = {};

  data.forEach(msg => {
    if (!grupos[msg.visitor_id]) {
      grupos[msg.visitor_id] = [];
    }
    grupos[msg.visitor_id].push(msg);
  });

  lista.innerHTML = "";

  Object.entries(grupos).forEach(([visitorId, mensajes]) => {
    const bloque = document.createElement("div");

    bloque.style.cssText =
      "margin-top:20px;padding:15px;border:1px solid #ddd;border-radius:12px;";

    const titulo = document.createElement("h4");
    titulo.textContent = "👤 " + (mensajes[0].customer_name || "Cliente");
    bloque.appendChild(titulo);
const responder = document.createElement("button");

responder.textContent = "💬 Abrir chat";
responder.type = "button";
responder.style.cssText =
  "margin:10px 0;padding:10px 16px;border:0;border-radius:10px;background:#7650a5;color:#fff;font-weight:700;cursor:pointer;";

responder.onclick = () => responderCliente(visitorId, bloque);

bloque.appendChild(responder);
    const ultimo = mensajes[mensajes.length - 1];

const estado = document.createElement("p");

estado.textContent =
  ultimo.sender === "visitor"
    ? "🔴 Nuevo mensaje"
    : "🟢 Respondido";

estado.style.cssText =
  "margin:8px 0 6px;font-weight:700;color:#544557;";

bloque.appendChild(estado);

const ultimoMensaje = document.createElement("p");

ultimoMensaje.textContent =
  "Último mensaje: " + ultimo.message;

ultimoMensaje.style.cssText =
  "margin:0 0 12px;color:#544557;";

bloque.appendChild(ultimoMensaje);
lista.appendChild(bloque);
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    setTimeout(cargarConversaciones, 300);
  }
});
</script>
  <script>
async function responderCliente(visitorId, bloque) {
  const { data, error } = await sb
    .from("chat_messages")
    .select("customer_name, sender, message, created_at")
    .eq("visitor_id", visitorId)
    .order("created_at", { ascending: true });

  if (error) {
    console.error(error);
    alert("❌ No se pudo abrir la conversación.");
    return;
  }

  bloque.innerHTML = "";

  bloque.style.cssText =
    "margin-top:20px;padding:18px;border:1px solid #ddd;border-radius:14px;background:#fffaf4;";

  const nombre = document.createElement("h3");
  nombre.textContent =
    "💬 " + (data?.[0]?.customer_name || "Cliente");
  nombre.style.margin = "0 0 15px";
  bloque.appendChild(nombre);

  const cerrar = document.createElement("button");
  cerrar.textContent = "← Volver a conversaciones";
  cerrar.type = "button";
  cerrar.style.cssText =
    "margin-bottom:15px;padding:9px 14px;border:0;border-radius:10px;background:#eee;color:#544557;font-weight:700;cursor:pointer;";

  cerrar.onclick = () => {
    cargarConversaciones();
  };

  bloque.appendChild(cerrar);

  const historial = document.createElement("div");
  historial.style.cssText =
    "max-height:350px;overflow-y:auto;margin-bottom:12px;";

  (data || []).forEach(msg => {
    const burbuja = document.createElement("div");

    burbuja.textContent = msg.message;

    burbuja.style.cssText =
      msg.sender === "visitor"
        ? "background:#f3eadf;color:#544557;padding:11px 13px;border-radius:12px;margin:8px 30px 8px 0;"
        : "background:#7650a5;color:#fff;padding:11px 13px;border-radius:12px;margin:8px 0 8px 30px;";

    historial.appendChild(burbuja);
  });

  bloque.appendChild(historial);

  const caja = document.createElement("div");

  caja.style.cssText =
    "display:flex;gap:8px;margin-top:12px;";

  const input = document.createElement("input");

  input.type = "text";
  input.placeholder = "Escribe tu respuesta...";
  input.style.cssText =
    "flex:1;padding:12px;border:1px solid #ddd;border-radius:10px;";

  const enviar = document.createElement("button");

  enviar.textContent = "➤ Enviar";
  enviar.type = "button";
  enviar.style.cssText =
    "padding:12px 16px;border:0;border-radius:10px;background:#7650a5;color:#fff;font-weight:700;cursor:pointer;";

  enviar.onclick = async () => {
    const mensaje = input.value.trim();

    if (!mensaje) return;

    enviar.disabled = true;

    const { error } = await sb
      .from("chat_messages")
      .insert({
        visitor_id: visitorId,
        sender: "admin",
        message: mensaje
      });

    enviar.disabled = false;

    if (error) {
      alert("❌ No se pudo enviar la respuesta.");
      console.error(error);
      return;
    }

    const burbuja = document.createElement("div");

    burbuja.textContent = mensaje;

    burbuja.style.cssText =
      "background:#7650a5;color:#fff;padding:11px 13px;border-radius:12px;margin:8px 0 8px 30px;";

    historial.appendChild(burbuja);
    historial.scrollTop = historial.scrollHeight;

    input.value = "";
    input.focus();
  };

  caja.appendChild(input);
  caja.appendChild(enviar);

  bloque.appendChild(caja);

  historial.scrollTop = historial.scrollHeight;
  input.focus();
}
  </script>
</body>
</html>
